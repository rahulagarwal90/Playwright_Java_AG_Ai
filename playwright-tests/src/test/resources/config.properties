# Default Playwright action/navigation timeout in milliseconds (click, fill, waitFor, etc).
# Playwright's own built-in default is 30000ms. Lowered here for faster feedback while manually
# breaking locators during Healer development. Raise this back to something more generous (e.g.
# 30000) for real CI runs against potentially slower pages.
playwright.timeout=10000
